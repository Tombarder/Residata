<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Opening Stripe… — Residata</title>
  <style>
    :root { --bg:#0a0a0b; --panel:#14141a; --text:#e8e8ed; --dim:#8a8a96; --accent:#00e5a0; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased; text-align: center; padding: 1.5rem;
    }
    .card { max-width: 420px; }
    .mark {
      width: 46px; height: 46px; border-radius: 11px;
      background: var(--accent); color: #06140f;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.4rem; letter-spacing: -0.02em;
      margin-bottom: 1.4rem; font-family: 'JetBrains Mono', monospace;
    }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 1.25rem;
      border: 3px solid rgba(0,229,160,0.18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.15rem; font-weight: 700; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
    p { color: var(--dim); font-size: 0.9rem; line-height: 1.55; margin: 0; }
    .slow { color: var(--dim); font-size: 0.8rem; margin-top: 1.4rem; opacity: 0; transition: opacity 0.4s; }
    .slow.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">R</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Opening Stripe…</h1>
    <p>Redirecting you to Stripe's secure page in a moment. Please keep this tab open.</p>
    <p class="slow" id="slow">Taking longer than usual — you can close this tab and try again from Residata.</p>
  </div>
  <script>
    // Purely a fallback hint. The parent window (residata.eu) navigates this tab
    // to Stripe as soon as the checkout session is ready; no redirect logic lives
    // here. If that hasn't happened in a while, gently surface a "try again" note.
    setTimeout(function () {
      var el = document.getElementById('slow');
      if (el) el.className = 'slow show';
    }, 12000);
  </script>
</body>
</html>
