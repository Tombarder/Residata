<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Color scheme + brand -->
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />

    <!-- PERF Step 2: build-time market snapshot, injected so the hero/headline
         can paint REAL numbers on first render without waiting for the DB.
         __BUILD_SNAPSHOT_JSON__ is replaced at build by vite.config.js with the
         latest market_totals snapshot (or `null` if build data is absent →
         graceful fallback to the live fetch). Classic inline script: runs during
         HTML parse, before the deferred module bundle, so window.__RESIDATA_SNAPSHOT__
         is already set when src/lib/useData.js seeds useMarketTotals. -->
    <script>window.__RESIDATA_SNAPSHOT__ = __BUILD_SNAPSHOT_JSON__;</script>

    <!-- Theme baseline = dark. The light theme is scoped to the PLATFORM (/app):
         PlatformShell applies the stored preference on mount and reverts to dark on
         unmount, so the public marketing site always renders in its designed dark look
         (its hero/sections aren't themed). Mirrors src/lib/theme-mode.js. -->
    <script>document.documentElement.setAttribute('data-theme','dark');</script>

    <!-- Primary meta (overridden per-route at runtime via useSeoMeta) -->
    <title>Residata — New-Build Market Intelligence for Slovakia & Czechia</title>
    <meta name="description" content="Automated market intelligence on every new residential development across Slovakia and Czechia. Pricing, availability, absorption rate, and trends — structured and refreshed daily. Built for developers, banks, valuers, and investors." />
    <meta name="keywords" content="novostavby Bratislava, novostavby Praha, trh novostavieb, real estate market intelligence, residential development data, new-build pricing, absorption rate, property data Slovakia, property data Czechia, market analytics real estate" />
    <meta name="author" content="Residata" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical + language alternates (updated per-route at runtime) -->
    <link rel="canonical" href="https://residata.eu/" />
    <link rel="alternate" hreflang="en" href="https://residata.eu/" />
    <link rel="alternate" hreflang="sk" href="https://residata.eu/" />
    <link rel="alternate" hreflang="cs" href="https://residata.eu/" />
    <link rel="alternate" hreflang="x-default" href="https://residata.eu/" />

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Residata" />
    <meta property="og:title" content="Residata — New-Build Market Intelligence for Slovakia & Czechia" />
    <meta property="og:description" content="Every new residential development across Slovakia and Czechia, structured and refreshed daily. Pricing, availability, absorption, trends — built for developers, banks, and investors." />
    <meta property="og:image" content="https://residata.eu/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Residata — Slovak & Czech new-build market intelligence dashboard" />
    <meta property="og:url" content="https://residata.eu/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="sk_SK" />
    <meta property="og:locale:alternate" content="cs_CZ" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Residata — Slovak & Czech New-Build Market Intelligence" />
    <meta name="twitter:description" content="Every new residential development across Slovakia & Czechia, structured and refreshed daily. Pricing, availability, absorption — for developers, banks, investors." />
    <meta name="twitter:image" content="https://residata.eu/og-image.png" />
    <meta name="twitter:image:alt" content="Residata — Slovak & Czech new-build market intelligence dashboard" />

    <!-- App-specific meta (helps parsers + LLM ingestion) -->
    <meta name="application-name" content="Residata" />
    <meta name="apple-mobile-web-app-title" content="Residata" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%2300e5a0'/%3E%3Ctext x='14' y='20' text-anchor='middle' font-family='monospace' font-weight='700' font-size='16' fill='%230a0a0b'%3ER%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect to third-parties actually used on first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://mtclsrswxtjseewyrcbx.supabase.co" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Structured data: Organization — helps Google + LLMs understand who we are.
         Multi-schema @graph so one block covers Organization + WebSite + SoftwareApplication.
         SoftwareApplication price is injected at build from public.pricing_config (the admin Pricing editor) via vite.config.js __SCHEMA_MONTHLY_PRICE_NUM__ — do not hardcode.
         offers → single monthly subscription Offer. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://residata.eu/#org",
          "name": "Residata",
          "legalName": "__COMPANY_LEGAL_NAME__",
          "url": "https://residata.eu/",
          "logo": "https://residata.eu/favicon.svg",
          "foundingDate": "__COMPANY_FOUNDED__",
          "identifier": {
            "@type": "PropertyValue",
            "propertyID": "ICO",
            "value": "__COMPANY_ICO__"
          },
          __COMPANY_TAXID_LINE__
          __COMPANY_VATID_LINE__
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "__COMPANY_STREET__",
            "postalCode": "__COMPANY_POSTAL__",
            "addressLocality": "__COMPANY_CITY__",
            "addressCountry": "__COMPANY_COUNTRY__"
          },
          "telephone": "__COMPANY_PHONE__",
          "slogan": "New-build market data you can act on.",
          "description": "Residata delivers structured market intelligence on every new residential development across Slovakia and Czechia. Pricing, availability, absorption rate, and trends — refreshed daily.",
          "email": "info@residata.eu",
          "sameAs": [
            "https://www.linkedin.com/company/residataeu"
          ],
          "areaServed": [
            { "@type": "Country", "name": "Slovakia" },
            { "@type": "Country", "name": "Czechia" }
          ],
          "foundingDate": "2026",
          "knowsAbout": [
            "Residential real estate market",
            "New-build development data",
            "Property market analytics",
            "Absorption rate analysis",
            "Price per square meter trends",
            "Sales velocity tracking"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://residata.eu/#website",
          "url": "https://residata.eu/",
          "name": "Residata",
          "description": "New-build market intelligence for Slovakia & Czechia",
          "publisher": { "@id": "https://residata.eu/#org" },
          "inLanguage": ["en", "sk", "cs"]
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://residata.eu/#software",
          "name": "Residata Market Intelligence Platform",
          "applicationCategory": "BusinessApplication",
          "applicationSubCategory": "Real Estate Market Intelligence",
          "operatingSystem": "Web (any modern browser)",
          "description": "Daily-refreshed dataset and dashboard covering every new residential development across Slovakia and Czechia: pricing, availability, absorption, €/m², sell-out forecasts.",
          "publisher": { "@id": "https://residata.eu/#org" },
          "offers": {
            "@type": "Offer",
            "priceCurrency": "EUR",
            "price": "__SCHEMA_MONTHLY_PRICE_NUM__"
          },
          "featureList": [
            "Every new-build residential project across Slovakia & Czechia",
            "Daily refresh",
            "Unit-level pricing and availability",
            "Absorption rate by district and project",
            "Developer comparison",
            "Export to CSV, XLSX, or API"
          ]
        },
        {
          "@type": "Service",
          "@id": "https://residata.eu/#service",
          "serviceType": "Real estate market intelligence",
          "provider": { "@id": "https://residata.eu/#org" },
          "areaServed": [
            { "@type": "Country", "name": "Slovakia" },
            { "@type": "Country", "name": "Czechia" }
          ],
          "audience": {
            "@type": "BusinessAudience",
            "audienceType": "Developers, banks, valuers, investors, real estate consultants"
          },
          "description": "Daily-refreshed intelligence on the Slovak and Czech new-build residential markets — covering pricing, availability, absorption, and trends across every active project."
        }
      ]
    }
    </script>

    <!-- FAQ structured data — helps LLMs quote Residata when users ask about it.
         Questions are real ones buyers ask; answers are factual and citable. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Residata?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Residata is a market intelligence platform that tracks every new residential development across Slovakia and Czechia. It delivers structured data on pricing, availability, absorption rate, and sales velocity — refreshed daily — to developers, banks, valuers, and investors."
          }
        },
        {
          "@type": "Question",
          "name": "What data does Residata cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every active new-build residential project across Slovakia and Czechia: unit counts, prices and price per square meter, availability, sold and reserved status, floor, orientation, handover date, developer, district. __SCHEMA_TOTAL_PROJECTS_TRACKED__ projects in dataset (__SCHEMA_TOTAL_PROJECTS__ currently active in the market), roughly __SCHEMA_TOTAL_UNITS__ units across active projects as of __SCHEMA_MONTH_LABEL__. Sold-out projects stay in the dataset as historical comparable transactions for valuers and banks."
          }
        },
        {
          "@type": "Question",
          "name": "How often is the data updated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Daily. A full synchronization runs every day, refreshing prices, availability, and project status across all tracked developments."
          }
        },
        {
          "@type": "Question",
          "name": "Who uses Residata?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Residential developers (pricing, positioning, absorption benchmarks), banks and valuers (comparable transactions), real estate investors (pipeline and deal discovery), consultants and analysts (market reports)."
          }
        },
        {
          "@type": "Question",
          "name": "Where is Residata's data sourced from?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every developer's public listing site across Slovakia and Czechia. Residata normalizes and validates the data centrally, so buyers get a single consistent schema instead of hundreds of different formats."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Residata cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "__SCHEMA_MONTHLY_PRICE__ per month for full ongoing access with fresh data every day — an early-access price (regular __SCHEMA_ANCHOR_PRICE__). A 7-day free trial is available."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Noscript fallback — for crawlers that don't run JS and for
         accessibility. Provides a minimum description of the site. -->
    <noscript>
      <div style="padding:2rem;font-family:sans-serif;color:#e8e8ed;background:#0a0a0b;">
        <h1>Residata</h1>
        <p>New-build residential market intelligence for Slovakia & Czechia. Daily-refreshed data on pricing, availability, absorption, and trends across every active development.</p>
        <p>This app requires JavaScript. Please enable it or contact <a href="mailto:info@residata.eu" style="color:#00e5a0;">info@residata.eu</a> for the static report.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
