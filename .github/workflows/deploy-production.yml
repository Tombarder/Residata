name: Deploy to production (Vercel)

# WHY THIS EXISTS
# Vercel's git-integration auto-promote stopped updating the live production URL:
# every push to main built SUCCESSFULLY, but residata-gamma.vercel.app stayed frozen
# on an old build — so shipped fixes never actually went live. This workflow makes the
# production promotion EXPLICIT and version-controlled: every push to main is built and
# PROMOTED to the production domain via `vercel deploy --prod`. It can never silently
# freeze again, and it's auditable here in the repo.
#
# ONE-TIME SETUP — add 3 repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      → vercel.com → Account Settings → Tokens → Create Token
#   VERCEL_ORG_ID     → Vercel team (tombarders-projects) → Settings → Team ID
#   VERCEL_PROJECT_ID → Vercel "residata" project → Settings → General → Project ID
# Until all three are set this workflow is a no-op (it does NOT fail the build).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Are the Vercel secrets configured?
        id: gate
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets present — will build + promote to production."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy skipped::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets to enable automatic production deploys."
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm install -g vercel@latest

      - name: Pull production project settings
        if: steps.gate.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy + promote to the production domain
        if: steps.gate.outputs.ready == 'true'
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deployed + promoted to production: $url"
          echo "PROD_URL=$url" >> "$GITHUB_ENV"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify the live URL is on the new build
        if: steps.gate.outputs.ready == 'true'
        run: |
          sleep 8
          live="$(curl -s https://residata-gamma.vercel.app/app/locations | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
          echo "residata-gamma.vercel.app now serves: ${live:-<none>}"
