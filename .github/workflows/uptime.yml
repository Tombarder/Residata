name: Uptime probe

# An EXTERNAL check on residata.eu.
#
# Everything else that watches this system runs inside it: the app's own health
# endpoints, the scraper's alerts, the database's integrity checks. All of them
# go quiet at exactly the moment they are most needed — when the site is down.
# GitHub's runners are outside our hosting, our DNS and our database, so this
# probe survives the failures the internal ones cannot report.
#
# Deliberately not a third-party monitoring service: this needs no account, no
# subscription and no vendor holding another credential, and the Terms now
# promise 99.5 % monthly availability, so the evidence should be ours.
#
# Every 15 minutes is the practical floor — GitHub throttles scheduled workflows
# under load and does not guarantee the minute, so treat this as "roughly every
# quarter hour", not a stopwatch.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the public surfaces
        id: probe
        run: |
          set -uo pipefail
          fail=""

          # Each entry: URL | what must appear in the body.
          # Checking a STRING, not just a 200: a broken deploy, an expired
          # certificate chain or a blank React mount can all return 200 while
          # serving nothing a customer can use.
          probe() {
            url="$1"; needle="$2"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" != "200" ]; then
              echo "DOWN  $url — HTTP $code"
              fail="$fail\n- $url returned HTTP $code"
              return
            fi
            if ! grep -q "$needle" /tmp/body; then
              echo "BAD   $url — 200 but missing \"$needle\""
              fail="$fail\n- $url returned 200 but its content is wrong (missing \"$needle\")"
              return
            fi
            echo "ok    $url"
          }

          probe "https://residata.eu/"                          "Residata"
          probe "https://residata.eu/llms.txt"                  "Total projects in dataset"
          probe "https://residata.eu/.well-known/security.txt"  "Contact: mailto:"

          # The API must reject an unauthenticated checkout — a 200 here would
          # mean the paywall is open, which is worse than the site being down.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                 -X POST "https://residata.eu/api/stripe?action=checkout" || echo 000)
          case "$code" in
            401|403) echo "ok    checkout rejects anonymous callers (HTTP $code)" ;;
            000)     echo "DOWN  checkout unreachable";      fail="$fail\n- the payment endpoint is unreachable" ;;
            *)       echo "BAD   checkout answered HTTP $code"; fail="$fail\n- the payment endpoint answered HTTP $code to an anonymous request" ;;
          esac

          # The TLS certificate, before a customer finds it expired.
          exp=$(echo | openssl s_client -servername residata.eu -connect residata.eu:443 2>/dev/null \
                | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -n "$exp" ]; then
            days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
            echo "cert  expires in $days days ($exp)"
            [ "$days" -lt 10 ] && fail="$fail\n- the TLS certificate expires in $days days"
          fi

          if [ -n "$fail" ]; then
            { echo "failed<<EOF"; echo -e "$fail"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open or update an issue when the site is not healthy
        if: failure()
        uses: actions/github-script@v7
        env:
          DETAIL: ${{ steps.probe.outputs.failed }}
        with:
          script: |
            const title = "🔴 residata.eu is not healthy";
            const body = [
              "The external uptime probe failed.",
              "",
              process.env.DETAIL || "(no detail captured — see the run log)",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "_This issue is reopened rather than duplicated on each failure, and stays open until someone closes it._",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "uptime", per_page: 5,
            });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["uptime"] });
            }
